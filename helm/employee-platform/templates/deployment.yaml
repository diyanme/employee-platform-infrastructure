apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: employee-platform
  template:
    metadata:
      labels:
        app: employee-platform
    spec:
      containers:
        - name: employee-platform
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          command:
            - php
            - artisan
            - serve
            - --host=0.0.0.0
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
